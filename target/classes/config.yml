

cooldown:
  padrao-segundos: 60
  max-segundos: 86400
  presets: [30, 60, 120, 300, 600]
  bossbar:
    cor: YELLOW
    estilo: SOLID

times:
  minimo-jogadores: 2
  azul:
    nome: "&9Time Azul"
  vermelho:
    nome: "&cTime Vermelho"

entrada:
  adicionar-online-ao-fechar: true

menu:
  titulos:
    principal: "&8Painel de Eventos"
    regras: "&8Eventos » Regras"
    times: "&8Eventos » Times"
    cooldown: "&8Eventos » Cooldown"
    jogadores: "&8Eventos » Jogadores"
  ativado: "&aATIVADO"
