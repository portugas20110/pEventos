  entrada-fechada: "&cFECHADA"

  itens:
    voltar:
      nome: "&c« Voltar"
      descricao:
        - "&7Volta ao menu principal."

    principal:
      regras:
        nome: "&6Regras"
        descricao:
          - "&7PvP, blocos, interação, queda,"
          - "&7fome, drops, chat e movimento."
          - ""
          - "&eClique para abrir"
      times:
        nome: "&9Times"
        descricao:
          - "&7Times automáticos Azul e Vermelho."
          - "&7Estado: {estado}"
          - ""
          - "&eClique para abrir"
      cooldown:
        nome: "&eCooldown"
        descricao:
          - "&7Contagem regressiva com BossBar."
          - "&7Estado: {estado}"
          - ""
          - "&eClique para abrir"
      jogadores:
        nome: "&bJogadores"
        descricao:
          - "&7Curar, teleportar, kit, eliminação..."
          - "&7Vivos: &f{vivos} &8| &7Eliminados: &f{eliminados}"
          - ""
          - "&eClique para abrir"
      entrada:
        nome: "&dEntrada de jogadores"
        descricao:
          - "&7Controla a whitelist do servidor."
          - "&7Entrada: {estado}"
          - ""
          - "&eClique para abrir/fechar"
      resetar:
        nome: "&4Resetar evento"
        descricao:
          - "&7Desativa times e cooldown, restaura"
          - "&7todas as regras e revive eliminados."
          - ""
          - "&cShift + clique para confirmar"

    opcoes:
      pvp:
        nome: "&cPvP"
        descricao:
          - "&7Permite combate entre jogadores."
      quebrar:
        nome: "&6Quebrar blocos"
        descricao:
          - "&7Permite destruir blocos"
          - "&7(inclui encher baldes)."
      colocar:
        nome: "&aColocar blocos"
        descricao:
          - "&7Permite construir"
          - "&7(inclui despejar água e lava)."
      interacao:
        nome: "&bInteragir"
        descricao:
          - "&7Baús, portas, botões, alavancas,"
          - "&7aldeões e uso de itens."
      queda:
        nome: "&fDano de queda"
        descricao:
          - "&7Jogadores sofrem dano ao cair."
      fome:
        nome: "&eFome"
        descricao:
          - "&7A barra de fome diminui com o tempo."
      dropar:
        nome: "&7Dropar itens"
        descricao:
          - "&7Permite jogar itens no chão."
      chat:
        nome: "&dChat"
        descricao:
          - "&7Permite falar no chat."
          - "&8(quem tem eventos.bypass ainda fala)"
      movimento:
        nome: "&3Movimento"
        descricao:
          - "&7Desativado = jogadores congelados."
          - "&8(quem tem eventos.bypass ainda anda)"
      eliminacao:
        nome: "&4Eliminação ao morrer"
        descricao:
          - "&7Quem morre vira espectador e o"
          - "&7último jogador/time vivo vence."

    times:
      ativar:
        nome: "&aAtivar Times"
        descricao:
          - "&7Divide os jogadores online em"
          - "&9Time Azul &7e &cTime Vermelho&7,"
          - "&7entrega armadura colorida e"
          - "&7bloqueia PvP entre aliados."
          - ""
          - "&7Estado: {estado}"
      desativar:
        nome: "&cDesativar Times"
        descricao:
          - "&7Remove os times, devolve a armadura"
          - "&7original e libera o PvP entre todos."
          - ""
          - "&7Estado: {estado}"
      sortear:
        nome: "&dSortear novamente"
        descricao:
          - "&7Refaz a divisão dos times"
          - "&7mantendo o sistema ativo."
      info:
        nome: "&fJogadores por time"
        descricao:
          - "&9Azul: &f{azul}"
          - "&cVermelho: &f{vermelho}"
          - ""
          - "&7Estado: {estado}"

    cooldown:
      preset:
        nome: "&eIniciar &f{tempo}"
        descricao:
          - "&7Inicia a BossBar com esse tempo."
          - "&7Estado: {estado}"
          - ""
          - "&8Outro tempo: /evento cooldown <segundos>"
      parar:
        nome: "&cParar cooldown"
        descricao:
          - "&7Cancela a contagem atual."
          - "&7Estado: {estado}"

    jogadores:
      curar:
        nome: "&aCurar todos"
        descricao:
          - "&7Vida e fome cheias para todos"
          - "&7os participantes."
      tpall:
        nome: "&5Teleportar todos até você"
        descricao:
          - "&7Leva os participantes até"
          - "&7a sua posição."
      spawn:
        nome: "&bSpawn do evento"
        descricao:
          - "&eClique esquerdo: &7leva todos ao spawn"
          - "&eClique direito: &7define o spawn aqui"
      kit:
        nome: "&6Kit do evento"
        descricao:
          - "&eClique esquerdo: &7entrega o kit a todos"
          - "&eClique direito: &7salva seu inventário"
          - "&7como kit"
      reviver:
        nome: "&aReviver todos"
        descricao:
          - "&7Devolve os eliminados ao jogo"
          - "&7(modo Survival, no spawn se houver)."
      vivos:
        nome: "&fJogadores vivos"
        descricao:
          - "&7Vivos: &f{vivos}"
          - "&7Eliminados: &f{eliminados}"
          - ""
          - "&eClique para listar no chat"
      limpar:
        nome: "&cLimpar inventários"
        descricao:
          - "&7Esvazia o inventário de todos"
          - "&7os participantes."
          - ""
          - "&cShift + clique para confirmar"

